<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>AI Pro</title>
  <!-- AI Pro app icon. Full-bleed background; the mark stays inside the central 60% (safe for maskable crops). -->
