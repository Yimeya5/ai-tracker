name: Update AI Tracker

# Runs every day at 10:00 UTC (6 AM New York time in summer, 5 AM in winter),
# whenever you press "Run workflow", and whenever you change a file.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the two helper libraries
        run: pip install -r requirements.txt

      - name: Fetch fresh data (each source keeps its last good copy if it is down)
        id: data
        continue-on-error: true
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          # Artificial Analysis is OFF unless the repository variable AA_ENABLED is "1" or "true".
          # Keep it off while the app is public: AA's Data Platform Terms don't allow its data in a public product.
          AA_ENABLED: ${{ vars.AA_ENABLED }}
          # AI-written detailed summaries for Updates stories (v16i). No key = no AI summaries; stories keep the short one.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: timeout 1800 python scripts/update_data.py

      - name: Check the data file is valid before saving it
        run: |
          python - <<'PY'
          import json
          d = json.load(open("data/data.json"))
          assert d.get("v") == 3, "old data format"
          # v17o: one main public test per task, ranked by its published scores (highest first, ties share a place)
          EARLY = {"video", "video_image", "voice", "pro"}
          def v17o(t, where):
              m = t.get("main") or {}
              assert m.get("name") and str(m.get("url", "")).startswith("https://") and (m.get("date") or m.get("checked")), where + " main test without name, link or date"
              rk = t.get("ranked") or []
              assert rk and all(r.get("k") and r.get("n") and isinstance(r.get("s"), (int, float)) and r.get("r", 0) >= 1 for r in rk), where + " ranked list missing or incomplete"
              assert all(a["s"] >= b["s"] and (b["r"] == a["r"] if b["s"] == a["s"] else b["r"] > a["r"]) for a, b in zip(rk, rk[1:])), where + " not ranked by published score"
              assert t.get("why") and t.get("winners") and t["winners"][0]["k"] == rk[0]["k"], where + " without reason, or winner is not the test's #1"
              assert t.get("early") is (t["id"] in EARLY), where + " early-data label wrong"
              c = t.get("cross")
              assert not c or (c.get("agree") in (True, False) and str(c.get("url", "")).startswith("https://") and c.get("date")), where + " bad cross-check"
          assert len(d["picks"]) >= 3, "too few picks"
          assert all(p["why"] and p["boards"] for p in d["picks"]), "pick without reason or sources"
          old = [p for p in d["picks"] if p.get("rules") != "v17o"]
          assert all(p["n"] >= 2 or (p["status"] == "single" and p["id"] == "pictures") for p in old), "pick from a single source"
          assert not any(p["status"] == "best" and p["n"] < 2 for p in old), "'best' from one source"
          for p in d["picks"]:
              if p.get("rules") == "v17o":
                  v17o(p, "pick " + p["id"])
                  assert p["status"] != "best", "v17o pick marked best: " + p["id"]
                  assert all(b["url"] and b["date"] for b in p["boards"]), "pick source without link or date: " + p["id"]
          assert d["cost"]["apps"], "no app prices"
          assert all(a["page"] and a["checked"] for a in d["cost"]["apps"]), "price without source or date"
          assert "items" in d["releases"] and "items" in d["bignews"], "missing releases or news"
          for s in ("lmarena", "livebench", "matharena", "taubench", "vals", "mercor", "designarena", "openrouter", "official", "prices", "news", "agentapps"):
              assert s in d["status"], "no status for " + s
          ag = d["agents"]
          if ag["best"].get("rules") == "v17o":
              gs = ag["best"].get("groups") or []
              assert gs and all(g.get("rules") == "v17o" for g in gs), "agent pick without its v17o groups"
              for g in gs:
                  v17o(g, "agent group " + g["id"])
              assert ag["best"]["testsUsed"] == [{"terminal": "vals_tb4", "pro": "apex"}[g["id"]] for g in gs], "agent tests used don't match the groups"
          else:
              assert all(w["top3"] >= 2 for w in ag["best"]["winners"]), "agent pick from fewer than 2 tests"
              assert ag["best"]["status"] != "best" or ag["best"]["n"] >= 2, "agent pick with fewer than 2 usable tests"
          assert len(ag["apps"]) >= 10, "agent apps missing"
          assert all(a["src"].get("url") and a["checked"] for a in ag["apps"]), "agent app without source or date"
          assert all(a["proof"] and a["proof"].get("url") for a in ag["apps"] if a.get("plansFrom")), "agent app without its proof page"
          assert len(ag["news"]["items"]) <= 8 and all(n["u"] and n["s"] and n["d"] for n in ag["news"]["items"]), "bad agent news"
          assert all(a.get("src") and a["src"].get("url") for a in d["cost"]["apps"]), "price without its source page"
          assert all(r["u"] and r["src"] for r in d["releases"]["items"]), "release without source"
          fi = d.get("finder") or {}
          for t in fi.get("tasks", []):
              assert t["why"] and t["boards"] and t["winners"], "finder task without reason, sources or models: " + t["id"]
              if t.get("rules") == "v17o":
                  v17o(t, "finder task " + t["id"])
                  assert t["status"] != "best", "v17o finder task marked best: " + t["id"]
              else:
                  assert t["status"] == "single" or t["n"] >= 2, "finder task called best from 1 source: " + t["id"]
              assert all(b["url"] and b["date"] for b in t["boards"]), "finder task source without link or date: " + t["id"]
          pv = fi.get("privacy")
          assert pv and pv["apps"], "no privacy data for Find your AI"
          assert all(c["src"].get("url") for a in pv["apps"].values() for c in a["checks"]), "privacy fact without its source"
          if not d["aaEnabled"]:
              raw = json.load(open("data/raw.json"))
              assert "aa" not in raw and "aa" not in d["status"], "Artificial Analysis data while it is switched off"
              assert not any(s["id"] == "aa" for s in d["sources"]), "Artificial Analysis listed while it is switched off"
              assert not any(p.get("usesAA") for p in d["picks"]), "pick uses Artificial Analysis while it is switched off"
          print("data ok, built", d["built"])
          PY

      - name: List stale prices and failed pages
        run: |
          python - <<'PY'
          import json
          d = json.load(open("data/data.json"))
          for x in d.get("stalePrices", []):
              print(f"::warning::Stale price: {x['app']} {x['plan']} last checked {x['checked']} (more than {d.get('staleDays', 30)} days ago)")
          for a in d["cost"]["apps"]:
              if not a.get("readToday"):
                  print(f"Price page not read today: {a['app']} (last checked {a['checked']})")
          for o in d.get("officialSources", []):
              if not o["ok"]:
                  print(f"::warning::Official page failed today: {o['label']} ({o.get('err', '')}) - using the last good copy")
          for a in d["agents"]["apps"]:
              pg = a["proof"] or a["src"]
              if not pg.get("readToday"):
                  print(f"Agent app page not read today: {a['app']} {pg.get('label', '')} (last checked {pg.get('checked')})")
          for t in d["agents"]["tests"]:
              if t["skipped"]:
                  print(f"::warning::Agent test left out: {t['name']} ({t['skipWhy']})")
              elif not t["ok"]:
                  print(f"::warning::Agent test not updated today: {t['name']} - using the last good copy")
          pv = (d.get("finder") or {}).get("privacy") or {}
          if pv.get("stale"):
              print(f"::warning::Privacy facts (scripts/privacy_static.json) were checked on {pv.get('checked')}, more than {pv.get('staleDays')} days ago")
          print("Find your AI extra tasks:", ", ".join(t["id"] for t in (d.get("finder") or {}).get("tasks", [])) or "none today")
          b = d["agents"]["best"]
          print("Best for agents:", ", ".join(f"{w['n']} ({w['top3']} of {b['n']})" for w in b["winners"]) or "no clear winner")
          print(f"{len(d.get('stalePrices', []))} stale prices")
          PY

      - name: Make sure the API key is not in any file
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: |
          if [ -n "$AA_API_KEY" ] && grep -rqF -- "$AA_API_KEY" data/ index.html app.js app.css sw.js; then
            echo "::error::The Artificial Analysis key was found in a file. Not saving."
            exit 1
          fi

      - name: Save new data (only when something changed)
        run: |
          git config user.name "ai-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Daily data update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Prepare the website files
        run: |
          mkdir -p _site
          cp -r index.html app.css app.js sw.js manifest.webmanifest .nojekyll icons data _site/
          rm -f _site/data/history.json _site/data/raw.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Report a failed data update
        if: steps.data.outcome == 'failure'
        run: |
          echo "::warning::Some data sources failed today. The app kept the last good copy for those parts (see the Sources view)."
