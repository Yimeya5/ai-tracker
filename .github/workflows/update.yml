name: Update AI Tracker

# Runs every day at 10:00 UTC (6 AM New York time in summer, 5 AM in winter),
# whenever you press "Run workflow", and whenever you change a file.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the two helper libraries
        run: pip install -r requirements.txt

      - name: Fetch fresh data (each source keeps its last good copy if it is down)
        id: data
        continue-on-error: true
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          # Artificial Analysis is OFF unless the repository variable AA_ENABLED is "1" or "true".
          # Keep it off while the app is public: AA's Data Platform Terms don't allow its data in a public product.
          AA_ENABLED: ${{ vars.AA_ENABLED }}
        run: timeout 900 python scripts/update_data.py

      - name: Check the data file is valid before saving it
        run: |
          python - <<'PY'
          import json
          d = json.load(open("data/data.json"))
          assert d.get("v") == 3, "old data format"
          assert len(d["picks"]) >= 3, "too few picks"
          assert all(p["why"] and p["boards"] for p in d["picks"]), "pick without reason or sources"
          assert all(p["n"] >= 2 or (p["status"] == "single" and p["id"] == "pictures") for p in d["picks"]), "pick from a single source"
          assert not any(p["status"] == "best" and p["n"] < 2 for p in d["picks"]), "'best' from one source"
          assert d["cost"]["apps"], "no app prices"
          assert all(a["page"] and a["checked"] for a in d["cost"]["apps"]), "price without source or date"
          assert "items" in d["releases"] and "items" in d["bignews"], "missing releases or news"
          for s in ("lmarena", "livebench", "epoch", "openrouter", "official", "prices", "news", "agentapps"):
              assert s in d["status"], "no status for " + s
          ag = d["agents"]
          assert all(w["top3"] >= 2 for w in ag["best"]["winners"]), "agent pick from fewer than 2 tests"
          assert ag["best"]["status"] != "best" or ag["best"]["n"] >= 2, "agent pick with fewer than 2 usable tests"
          assert len(ag["apps"]) >= 10, "agent apps missing"
          assert all(a["src"].get("url") and a["checked"] for a in ag["apps"]), "agent app without source or date"
          assert all(a["proof"] and a["proof"].get("url") for a in ag["apps"] if a.get("plansFrom")), "agent app without its proof page"
          assert len(ag["news"]["items"]) <= 8 and all(n["u"] and n["s"] and n["d"] for n in ag["news"]["items"]), "bad agent news"
          assert all(a.get("src") and a["src"].get("url") for a in d["cost"]["apps"]), "price without its source page"
          assert all(r["u"] and r["src"] for r in d["releases"]["items"]), "release without source"
          if not d["aaEnabled"]:
              raw = json.load(open("data/raw.json"))
              assert "aa" not in raw and "aa" not in d["status"], "Artificial Analysis data while it is switched off"
              assert not any(s["id"] == "aa" for s in d["sources"]), "Artificial Analysis listed while it is switched off"
              assert not any(p.get("usesAA") for p in d["picks"]), "pick uses Artificial Analysis while it is switched off"
          print("data ok, built", d["built"])
          PY

      - name: List stale prices and failed pages
        run: |
          python - <<'PY'
          import json
          d = json.load(open("data/data.json"))
          for x in d.get("stalePrices", []):
              print(f"::warning::Stale price: {x['app']} {x['plan']} last checked {x['checked']} (more than {d.get('staleDays', 30)} days ago)")
          for a in d["cost"]["apps"]:
              if not a.get("readToday"):
                  print(f"Price page not read today: {a['app']} (last checked {a['checked']})")
          for o in d.get("officialSources", []):
              if not o["ok"]:
                  print(f"::warning::Official page failed today: {o['label']} ({o.get('err', '')}) - using the last good copy")
          for a in d["agents"]["apps"]:
              pg = a["proof"] or a["src"]
              if not pg.get("readToday"):
                  print(f"Agent app page not read today: {a['app']} {pg.get('label', '')} (last checked {pg.get('checked')})")
          for t in d["agents"]["tests"]:
              if t["skipped"]:
                  print(f"::warning::Agent test left out: {t['name']} ({t['skipWhy']})")
              elif not t["ok"]:
                  print(f"::warning::Agent test not updated today: {t['name']} - using the last good copy")
          b = d["agents"]["best"]
          print("Best for agents:", ", ".join(f"{w['n']} ({w['top3']} of {b['n']})" for w in b["winners"]) or "no clear winner")
          print(f"{len(d.get('stalePrices', []))} stale prices")
          PY

      - name: Make sure the API key is not in any file
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: |
          if [ -n "$AA_API_KEY" ] && grep -rqF -- "$AA_API_KEY" data/ index.html app.js app.css sw.js; then
            echo "::error::The Artificial Analysis key was found in a file. Not saving."
            exit 1
          fi

      - name: Save new data (only when something changed)
        run: |
          git config user.name "ai-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Daily data update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Prepare the website files
        run: |
          mkdir -p _site
          cp -r index.html app.css app.js sw.js manifest.webmanifest .nojekyll icons data _site/
          rm -f _site/data/history.json _site/data/raw.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Report a failed data update
        if: steps.data.outcome == 'failure'
        run: |
          echo "::warning::Some data sources failed today. The app kept the last good copy for those parts (see the Sources view)."
